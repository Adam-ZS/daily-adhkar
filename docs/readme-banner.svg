      <circle r="69" fill="#3a2834" stroke="#e8b581"/>
      <path d="M0-60C8-19 19-8 60 0 19 8 8 19 0 60-8 19-19 8-60 0-19-8-8-19 0-60Z" fill="url(#gold)"/>
      <path d="M-115-105l9-9 9 9-9 9zm215 211 7-7 7 7-7 7z" fill="#f2ce9a"/>
    </g>
    <g font-family="system-ui, sans-serif">
      <text x="431" y="105" font-size="26" font-weight="700" fill="#f2ca96">أذكاري اليومية</text>
      <text x="426" y="177" font-size="70" font-weight="750" fill="#fff2e8">Daily Adhkar</text>
