<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
  <title id="title">Daily Adhkar · أذكاري اليومية</title>
  <desc id="desc">A golden eight-pointed ornament over a plum background, with the project name and features in English and Arabic.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#2f2037"/>
      <stop offset="1" stop-color="#16111d"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#865040" stop-opacity=".8"/>
      <stop offset="1" stop-color="#865040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff0c5"/>
      <stop offset="1" stop-color="#d89566"/>
    </linearGradient>
    <pattern id="lattice" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M-28 28 28-28M0 56 56 0M28 84 84 28M-28 28 28 84M0 0 56 56M28-28 84 28"
